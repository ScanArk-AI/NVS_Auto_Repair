# Build the offline Windows bundle (no WSL): compile the five CUDA extension
# wheels, assemble nvs_repair-<version>-win64 and split it into 7z volumes;
# for a v* tag, attach the volumes and their .sha256 to the GitHub Release.
#
# Hosted runners have no NVIDIA GPU, so the wheel and bundle checks run with
# -NoGpuCheck: every compiled module must load from the bundle without MSVC or
# the CUDA toolkit on PATH, but nothing runs on a GPU. Before announcing a
# release, unpack the volumes on a machine with an NVIDIA GPU and run
# build_wheels' full check there (windows/native/README.md) or a Repair run.
name: windows-native

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write              # attach the volumes to the Release

jobs:
  bundle:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Point the build scripts at this Python
        shell: pwsh
        run: echo "NVS_BUILD_PYTHON=${{ steps.py.outputs.python-path }}" >> $env:GITHUB_ENV
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
      - name: Free disk
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="free GB"; e={[math]::Round($_.Free / 1GB)}}
      - name: Build the CUDA extension wheels
        shell: pwsh
        run: ./windows/native/build_wheels.ps1 -NoGpuCheck
      - name: Assemble the bundle and split it
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "" }
          ./windows/native/build_bundle.ps1 -Version $v -NoGpuCheck
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/build_wheels.log
            build/build_bundle.log
            build/wheels/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: nvs_repair-win64
          path: |
            build/nvs_repair-*-win64.7z.*
            build/nvs_repair-*-win64.sha256
          compression-level: 0
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/nvs_repair-*-win64.7z.*
            build/nvs_repair-*-win64.sha256
